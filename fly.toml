# fly.toml app configuration file generated for booterr on 2026-11-01T10:40:02Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'booterr'
primary_region = 'ams'

[build]
  builder = 'paketobuildpacks/builder:base'

[deploy]
  release_command = 'python m.py'
  strategy = 'rolling'

[env]
  PORT = '8080'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
